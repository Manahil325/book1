## Content Retrieval API

### Get Chapter Content
```
GET /api/docs/module-2-digital-twins/chapter/{chapterId}
```

**Response**:
```json
{
  "chapterId": "chapter-1-gazebo-sim",
  "title": "Physics Simulation with Gazebo",
  "pages": [
    {
      "id": "physics-basics",
      "title": "Physics Basics",
      "content": "Markdown content for physics basics...",
      "learning_objectives": ["Understand physics simulation concepts", "Learn about mass, friction, and other parameters"],
      "estimated_time": "30 minutes"
    }
  ]
}
```

## Search API

### Search Documentation
```
GET /api/docs/module-2-digital-twins/search?q={query}
```

**Response**:
```json
{
  "query": "physics simulation",
  "results": [
    {
      "title": "Physics Basics",
      "url": "/docs/module-2-digital-twins/chapter-1-gazebo-sim/physics-basics",
